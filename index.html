        winStartTimeInput = document.createElement('input');
        winStartTimeInput.type = 'time';
        winStartTimeInput.value = (existing && existing.WeighInStartTime) || '06:00';
        startRow.appendChild(winStartDaySelect);
        startRow.appendChild(winStartTimeInput);
        field('Weigh-in window starts', startRow, windowFields);

        var endRow = document.createElement('div');
        endRow.className = 'rangeRow';
        winEndDaySelect = document.createElement('select');
        WEEKDAY_NAMES.forEach(function (name, idx) {
          var opt = document.createElement('option');
          opt.value = idx; opt.textContent = name;
          if (existing && Number(existing.WeighInEndDay) === idx) opt.selected = true;
          else if (!existing && idx === 0) opt.selected = true;
          winEndDaySelect.appendChild(opt);
        });
        winEndTimeInput = document.createElement('input');
        winEndTimeInput.type = 'time';
        winEndTimeInput.value = (existing && existing.WeighInEndTime) || '23:59';
        endRow.appendChild(winEndDaySelect);
        endRow.appendChild(winEndTimeInput);
        field('Weigh-in window ends', endRow, windowFields);
      }
      windowToggle.onchange = renderWindowFields;
      renderWindowFields();

      var msg = document.createElement('div');
      msg.className = 'msg';

      var saveBtn = document.createElement('button');
      saveBtn.innerHTML = '<span class="btnLabel">Save</span>';
      saveBtn.onclick = function () {
        if (!nameInput.value.trim()) { msg.textContent = 'Enter an event name.'; msg.className = 'msg error'; return; }
        var token = localStorage.getItem(TOKEN_KEY);
        var event = {
          EventID: existing ? existing.EventID : undefined,
          EventName: nameInput.value.trim(),
          ModuleType: 'WeightLoss',
          Visibility: visSelect.value,
          RegistrationStart: regStartInput.value,
          RegistrationEnd: regEndInput.value,
          EventEndDate: endDateInput.value,
          Description: descEditor.getValue(),
          LeaderboardFrequency: freqSelect.value,
          LeaderboardTime: timeInput.value || '13:00'
        };
        if (freqSelect.value === 'Weekly') {
          event.LeaderboardDayOfWeek = daySelect.value;
        } else if (freqSelect.value === 'Biweekly') {
          event.LeaderboardStartDate = startDateInput.value;
        } else if (freqSelect.value === 'Monthly') {
          event.LeaderboardMonthlyMode = monthlyModeSelect.value;
          if (monthlyModeSelect.value === 'weekday') {
            event.LeaderboardMonthlyOrdinal = monthlyOrdinalSelect.value;
            event.LeaderboardMonthlyWeekday = monthlyWeekdaySelect.value;
          } else {
            event.LeaderboardMonthlyDate = monthlyDateInput.value;
          }
        }
        if (windowToggle.checked) {
          event.WeighInStartDay = winStartDaySelect.value;
          event.WeighInStartTime = winStartTimeInput.value || '06:00';
          event.WeighInEndDay = winEndDaySelect.value;
          event.WeighInEndTime = winEndTimeInput.value || '23:59';
        } else {
          event.WeighInStartDay = '';
          event.WeighInStartTime = '';
          event.WeighInEndDay = '';
          event.WeighInEndTime = '';
        }
        setButtonLoading(saveBtn, true, 'Saving…');
        callApi('/api/admin/events/save', { token: token, event: event })
          .then(function () { refreshNavData(showAdminWeightLossHome); })
          .catch(function (err) {
            setButtonLoading(saveBtn, false);
            msg.textContent = err.message;
            msg.className = 'msg error';
          });
      };
      form.appendChild(saveBtn);

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = function () { showAdminWeightLossHome(); };
      form.appendChild(cancelBtn);

      form.appendChild(msg);
      main.appendChild(form);
    }

    function showAdminManageEvent(ev) {
      var main = document.getElementById('mainContent');
      main.innerHTML = '';

      var back = document.createElement('a');
      back.className = 'navlink';
      back.style.display = 'inline-block';
      back.style.marginBottom = '10px';
      back.textContent = '← Back to Weight Loss Admin';
      back.onclick = function () { showAdminWeightLossHome(); };
      main.appendChild(back);

      var h = document.createElement('h2');
      h.className = 'section-title';
      h.textContent = ev.EventName;
      h.appendChild(eventStatusBadge(ev.computedStatus));
      main.appendChild(h);

      var pendingTitle = document.createElement('h2');
      pendingTitle.className = 'section-title';
      pendingTitle.textContent = 'Pending Screenshots';
      main.appendChild(pendingTitle);
      var pendingContainer = document.createElement('div');
      main.appendChild(pendingContainer);
      loadAdminPending(ev.EventID, pendingContainer);

      var allTitle = document.createElement('h2');
      allTitle.className = 'section-title';
      allTitle.textContent = 'All Weigh-Ins';
      main.appendChild(allTitle);
      var allContainer = document.createElement('div');
      main.appendChild(allContainer);
      loadAdminAllWeighIns(ev.EventID, allContainer);

      var participantsTitle = document.createElement('h2');
      participantsTitle.className = 'section-title';
      participantsTitle.textContent = 'Participants';
      main.appendChild(participantsTitle);
      var participantsContainer = document.createElement('div');
      main.appendChild(participantsContainer);
      loadAdminParticipants(ev.EventID, participantsContainer);

      var insertTitle = document.createElement('h2');
      insertTitle.className = 'section-title';
      insertTitle.textContent = 'Insert or Correct a Weigh-In';
      main.appendChild(insertTitle);
      var insertContainer = document.createElement('div');
      main.appendChild(insertContainer);
      loadAdminInsertWeighInForm(ev.EventID, insertContainer, allContainer);
    }

    function loadAdminInsertWeighInForm(eventId, container, allContainer) {
      showLoadingRow(container, 'Loading participants…');
      var token = localStorage.getItem(TOKEN_KEY);
      callApi('/api/admin/weightloss/participants', { token: token, eventId: eventId })
        .then(function (participants) { renderAdminInsertWeighInForm(participants, eventId, container, allContainer); })
        .catch(function (err) { showErrorIn(container, err); });
    }

    function renderAdminInsertWeighInForm(participants, eventId, container, allContainer) {
      container.innerHTML = '';
      if (!participants.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No participants to insert a weigh-in for yet.';
        container.appendChild(empty);
        return;
      }

      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.style.marginBottom = '8px';
      desc.textContent = 'For a week the participant never submitted themselves (e.g. they told you their weight some other way). This creates the weigh-in directly, already verified.';
      container.appendChild(desc);

      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.gap = '8px';
      row.style.flexWrap = 'wrap';
      row.style.alignItems = 'center';

      var select = document.createElement('select');
      participants.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.email;
        opt.textContent = p.name + ' (' + p.email + ')';
        select.appendChild(opt);
      });

      var weekInput = document.createElement('input');
      weekInput.type = 'number';
      weekInput.min = '1';
      weekInput.placeholder = 'Week #';
      weekInput.style.width = '90px';

      var weightInput = document.createElement('input');
      weightInput.type = 'number';
      weightInput.step = '0.1';
      weightInput.placeholder = 'Weight';
      weightInput.style.width = '100px';

      var insertBtn = document.createElement('button');
      insertBtn.className = 'actionBtn';
      insertBtn.innerHTML = '<span class="btnLabel">Insert Weight</span>';

      var msg = document.createElement('div');
      msg.className = 'msg';

      insertBtn.onclick = function () {
        var token = localStorage.getItem(TOKEN_KEY);
        msg.textContent = '';
        if (!weekInput.value || !weightInput.value) {
          msg.textContent = 'Enter a week and weight.';
          msg.className = 'msg error';
          return;
        }
        setButtonLoading(insertBtn, true, 'Saving…');
        callApi('/api/admin/weightloss/insert-weighin', {
          token: token, eventId: eventId, email: select.value, week: weekInput.value, weight: weightInput.value
        })
          .then(function () {
            setButtonLoading(insertBtn, false);
            weekInput.value = '';
            weightInput.value = '';
            msg.textContent = 'Weigh-in saved.';
            msg.className = 'msg ok';
            loadAdminAllWeighIns(eventId, allContainer);
          })
          .catch(function (err) {
            setButtonLoading(insertBtn, false);
            msg.textContent = err.message;
            msg.className = 'msg error';
          });
      };

      row.appendChild(select);
      row.appendChild(weekInput);
      row.appendChild(weightInput);
      row.appendChild(insertBtn);
      container.appendChild(row);
      container.appendChild(msg);
    }

    function loadAdminPending(eventId, container) {
      showLoadingRow(container, 'Loading screenshots…');
      var token = localStorage.getItem(TOKEN_KEY);
      callApi('/api/admin/weightloss/pending', { token: token, eventId: eventId })
        .then(function (items) { renderAdminPending(items, eventId, container); })
        .catch(function (err) { showErrorIn(container, err); });
    }

    function renderAdminPending(items, eventId, container) {
      container.innerHTML = '';
      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Nothing waiting on verification.';
        container.appendChild(empty);
        return;
      }
      items.forEach(function (item) {
        container.appendChild(renderPendingCard(item, eventId, container));
      });
    }

    function loadAdminAllWeighIns(eventId, container) {
      showLoadingRow(container, 'Loading weigh-ins…');
      var token = localStorage.getItem(TOKEN_KEY);
      callApi('/api/admin/weightloss/all', { token: token, eventId: eventId })
        .then(function (items) { renderAdminAllWeighIns(items, container); })
        .catch(function (err) { showErrorIn(container, err); });
    }

    function renderAdminAllWeighIns(items, container) {
      container.innerHTML = '';
      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No weigh-ins submitted yet.';
        container.appendChild(empty);
        return;
      }
      var sorted = items.slice().sort(function (a, b) {
        if (Number(a.week) !== Number(b.week)) return Number(a.week) - Number(b.week);
        return String(a.name).localeCompare(String(b.name));
      });
      var table = document.createElement('table');
      table.innerHTML = '<tr><th>Name</th><th>Email</th><th>Week</th><th>Weight</th><th>Verified</th><th>Photo</th></tr>';
      sorted.forEach(function (w) {
        var tr = document.createElement('tr');
        var nameTd = document.createElement('td'); nameTd.textContent = w.name;
        var emailTd = document.createElement('td'); emailTd.textContent = w.email;
        var weekTd = document.createElement('td'); weekTd.textContent = w.week;
        var weightTd = document.createElement('td'); weightTd.textContent = w.weight;
        var verifiedTd = document.createElement('td'); verifiedTd.textContent = w.verified ? 'Yes' : 'Pending';
        var photoTd = document.createElement('td');
        if (w.photoUrl) {
          var link = document.createElement('a');
          link.href = w.photoUrl;
          link.target = '_blank';
          link.textContent = 'View';
          photoTd.appendChild(link);
        } else {
          photoTd.textContent = '—';
        }
        [nameTd, emailTd, weekTd, weightTd, verifiedTd, photoTd].forEach(function (td) { tr.appendChild(td); });
        table.appendChild(tr);
      });
      container.appendChild(wrapTable(table));
    }

    function renderPendingCard(item, eventId, container) {
      var card = document.createElement('div');
      card.className = 'weighInCard';

      var fields = document.createElement('div');
      fields.className = 'fields';
      fields.innerHTML =
        '<div><strong>Email:</strong> ' + item.email + '</div>' +
        '<div><strong>Name:</strong> ' + item.name + '</div>' +
        '<div><strong>Week:</strong> ' + item.week + '</div>' +
        '<div><strong>Weight:</strong> ' + item.weight + '</div>';
      card.appendChild(fields);

      if (item.photoUrl) {
        var img = document.createElement('img');
        img.src = item.photoUrl;
        card.appendChild(img);
      }

      var actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '8px';

      var verifyBtn = document.createElement('button');
      verifyBtn.className = 'actionBtn';
      verifyBtn.innerHTML = '<span class="btnLabel">Verify</span>';
      verifyBtn.onclick = function () {
        var token = localStorage.getItem(TOKEN_KEY);
        setButtonLoading(verifyBtn, true, 'Verifying…');
        callApi('/api/admin/weightloss/verify', { token: token, eventId: eventId, email: item.email, week: item.week })
          .then(function () { loadAdminPending(eventId, container); })
          .catch(function (err) { setButtonLoading(verifyBtn, false); alert(err.message); });
      };
      actions.appendChild(verifyBtn);

      var amendBtn = document.createElement('button');
      amendBtn.className = 'actionBtn secondary';
      amendBtn.innerHTML = '<span class="btnLabel">Amend Weight</span>';
      var amendRow = document.createElement('div');
      amendRow.className = 'amendRow hidden';
      var amendInput = document.createElement('input');
      amendInput.type = 'number';
      amendInput.step = '0.1';
      amendInput.value = item.weight;
      var amendSaveBtn = document.createElement('button');
      amendSaveBtn.className = 'actionBtn';
      amendSaveBtn.innerHTML = '<span class="btnLabel">Save</span>';
      amendSaveBtn.onclick = function () {
        var token = localStorage.getItem(TOKEN_KEY);
        setButtonLoading(amendSaveBtn, true, 'Saving…');
        callApi('/api/admin/weightloss/amend', { token: token, eventId: eventId, email: item.email, week: item.week, newWeight: amendInput.value })
          .then(function () { loadAdminPending(eventId, container); })
          .catch(function (err) { setButtonLoading(amendSaveBtn, false); alert(err.message); });
      };
      var amendCancelBtn = document.createElement('button');
      amendCancelBtn.className = 'actionBtn secondary';
      amendCancelBtn.innerHTML = '<span class="btnLabel">Cancel</span>';
      amendCancelBtn.onclick = function () { amendRow.classList.add('hidden'); };
      amendRow.appendChild(amendInput);
      amendRow.appendChild(amendSaveBtn);
      amendRow.appendChild(amendCancelBtn);

      amendBtn.onclick = function () { amendRow.classList.remove('hidden'); };
      actions.appendChild(amendBtn);

      card.appendChild(actions);
      card.appendChild(amendRow);
      return card;
    }

    function loadAdminParticipants(eventId, container) {
      showLoadingRow(container, 'Loading participants…');
      var token = localStorage.getItem(TOKEN_KEY);
      callApi('/api/admin/weightloss/participants', { token: token, eventId: eventId })
        .then(function (participants) { renderAdminParticipants(participants, eventId, container); })
        .catch(function (err) { showErrorIn(container, err); });
    }

    function renderAdminParticipants(participants, eventId, container) {
      container.innerHTML = '';
      if (!participants.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No participants yet.';
        container.appendChild(empty);
        return;
      }
      var table = document.createElement('table');
      table.innerHTML = '<tr><th>Name</th><th>Email</th><th>Paid</th></tr>';
      participants.forEach(function (p) {
        var tr = document.createElement('tr');
        var nameTd = document.createElement('td');
        nameTd.textContent = p.name;
        var emailTd = document.createElement('td');
        emailTd.textContent = p.email;
        var paidTd = document.createElement('td');
        var btn = document.createElement('button');
        btn.className = 'actionBtn' + (p.paid ? '' : ' secondary');
        btn.innerHTML = '<span class="btnLabel">' + (p.paid ? 'Paid ✓' : 'Mark Paid') + '</span>';
        btn.onclick = function () {
          var token = localStorage.getItem(TOKEN_KEY);
          setButtonLoading(btn, true, 'Updating…');
          callApi('/api/admin/weightloss/setpaid', { token: token, eventId: eventId, email: p.email, paid: !p.paid })
            .then(function () { loadAdminParticipants(eventId, container); })
            .catch(function (err) { setButtonLoading(btn, false); alert(err.message); });
        };
        paidTd.appendChild(btn);
        tr.appendChild(nameTd);
        tr.appendChild(emailTd);
        tr.appendChild(paidTd);
        table.appendChild(tr);
      });
      container.appendChild(wrapTable(table));
    }

    // ---------- boot ----------

    initTheme();

    (function boot() {
      var token = localStorage.getItem(TOKEN_KEY);
      if (!token) {
        hidePageLoading();
        document.getElementById('loginScreen').classList.remove('hidden');
        return;
      }
      callApi('/api/session', { token: token })
        .then(function (res) {
          hidePageLoading();
          if (!res.valid) {
            localStorage.removeItem(TOKEN_KEY);
            document.getElementById('loginScreen').classList.remove('hidden');
            return;
          }
          currentUser = res.user;
          enterApp();
        })
        .catch(function () {
          hidePageLoading();
          localStorage.removeItem(TOKEN_KEY);
          document.getElementById('loginScreen').classList.remove('hidden');
        });
    })();
  </script>
</body>
</html>
